spring:
  config:
    activate:
      on-profile:develop
  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

beginner:
  api:
    payload:
      discord:
        scope:
          - Exception
        web-hook-url: ${DISCORD_WEBHOOK_URL}
        enable: true
